[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undertone-emotion"
version = "0.1.0"
description = "Emotion vectors: build them from stories, and read which emotions stand out in a capture."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# undertone-models and undertone-capture are this repository's core/tools/models and core/tools/capture
dependencies = ["undertone-models", "undertone-capture", "safetensors>=0.8", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
undertone-emotion = "undertone_emotion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["undertone_emotion"]

# the vector sets sit beside the package in a checkout and inside it in a wheel
[tool.hatch.build.targets.wheel.force-include]
"sets" = "undertone_emotion/sets"

[tool.pytest.ini_options]
testpaths = ["tests"]
