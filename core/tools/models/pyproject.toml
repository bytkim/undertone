[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undertone-models"
version = "0.1.0"
description = "Model contracts for the undertone tools: what each supported model is, and the only code that touches its internals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# reading a contract needs nothing
dependencies = []

[project.optional-dependencies]
# turning a transcript into tokens: the tokenizer only, no weights
tokens = ["transformers>=5.20.2", "jinja2>=3.1"]
# loading and reading the model itself. The versions the models were qualified with are in each contract.json.
run = ["torch>=2.14", "transformers>=5.20.2", "safetensors>=0.8", "accelerate>=1.13", "huggingface-hub>=2.4", "jinja2>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
undertone-models = "undertone_models.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["undertone_models"]

# each model's folder sits beside the package in a checkout and inside it in a wheel
[tool.hatch.build.targets.wheel.force-include]
"qwen3.5-4b" = "undertone_models/models/qwen3.5-4b"

[tool.pytest.ini_options]
testpaths = ["tests"]
