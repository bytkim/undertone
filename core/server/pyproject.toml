[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undertone-server"
version = "0.1.0"
description = "Readings for a chat page: one reply's emotions and lens words, made from its transcript and served over HTTP."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# the four undertone packages are this repository's core/tools: install them from there first (see the README)
dependencies = ["undertone-models", "undertone-capture", "undertone-jlens", "undertone-emotion"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
undertone-server = "undertone_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["undertone_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
