[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undertone-engine"
version = "0.1.0"
description = "Talk to any OpenAI-compatible endpoint and keep what was said as transcripts the undertone tools can read."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
# rebuilding token ids locally when the endpoint does not return them (the tokenizer only; no model weights)
tokens = ["transformers>=4.44", "jinja2>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
undertone-engine = "undertone_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/undertone_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
